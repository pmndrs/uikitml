name: Deploy Packages

on:
  push:
    tags:
      - '*'

jobs:
  deploy-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm -r build

      - name: Gitversion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0

      - name: Set Version
        run: |
          pnpm -r exec json -f "package.json" -I -e 'this.version = "${{ steps.gitversion.outputs.fullSemVer }}"'
          pnpm --filter "uikitml-vscode" exec json -f "package.json" -I -e 'this.dependencies[`@pmndrs/uikitml`] = "${{ steps.gitversion.outputs.fullSemVer }}"'

      - name: Set publishing config
        run: pnpm config set '//registry.npmjs.org/:_authToken' "${{ secrets.NPM_TOKEN }}"

      - name: Deploy uikitml-vanilla Package
        working-directory: ./packages/uikitml
        run: pnpm publish --access public --no-git-checks --tag latest

      - name: Package VS Code Extension
        working-directory: ./extension
        run: pnpm dlx vsce@latest package --no-dependencies

      - name: Publish VS Code Extension (Marketplace)
        working-directory: ./extension
        run: pnpm dlx vsce@latest publish --packagePath *.vsix -p ${{ secrets.VSCE_TOKEN }} --skip-duplicate

#      - name: Publish VS Code Extension (Open VSX)
#        working-directory: ./extension
#        run: pnpm dlx ovsx@latest publish *.vsix -p ${{ secrets.OVSX_TOKEN }} --skip-duplicate
