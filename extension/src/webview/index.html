<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>UIKit Preview</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <div id="react-root" style="width: 180px; flex-shrink: 0"></div>
    <div
      id="canvas-container"
      style="flex: 1; position: relative; overflow: hidden"
    ></div>
    <style>
      :root {
        --text-white: #dfdfdf;
        --panel-dark-grey: rgba(38, 38, 38, 0.7);
        --panel-grey: #3f3f3d;
        --panel-light-grey: #9c9c9b;
        --input-gradient-grey: linear-gradient(to bottom, #343434, #393939);
        --input-gradient-grey-translucent: linear-gradient(
          to bottom,
          rgba(52, 52, 52, 0.5),
          rgba(57, 57, 57, 0.5)
        );
        --panel-selected: #154c87;
        --danger-red: #f3978f;
      }
      .properties-panel {
        height: calc(100vh - 20px);
        width: calc(100% - 20px);
        margin: 10px;
        margin-right: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        background-color: var(--panel-dark-grey);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 10px;
        border: 1px solid var(--panel-grey);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        color: var(--text-white);
      }
      .properties-panel::-webkit-scrollbar {
        display: none;
      }
      .component-info {
        padding: 10px 12px;
        font-size: 0.7rem;
        color: var(--text-white);
        background: transparent;
        border-bottom: 1px solid var(--panel-grey);
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .component-id {
        color: var(--text-white);
        font-weight: bold;
        font-family: monospace;
        background-color: var(--panel-grey);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .component-class {
        color: var(--panel-light-grey);
        font-style: normal;
        background-color: var(--panel-grey);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .clickable {
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .clickable:hover {
        background-color: var(--panel-selected);
        color: var(--text-white);
      }
      .no-selection {
        font-size: 0.75rem;
        color: var(--panel-light-grey);
        padding: 12px;
        text-align: center;
      }
      .properties-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        scrollbar-width: none;
      }
      .properties-content::-webkit-scrollbar {
        display: none;
      }
      /* Canvas container styling */
      #canvas-container {
        background: #1e1e1e;
      }
      .property-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
        height: 20px;
      }
      .property-row label {
        font-size: 0.6rem;
        color: var(--text-white);
        flex-shrink: 0;
        min-width: 50px;
      }
      .property-row input,
      .property-row select {
        width: 70px;
        height: 20px;
        padding: 0 5px;
        border: 1px solid transparent;
        border-radius: 5px;
        font-size: 0.55rem;
        flex-shrink: 0;
        box-sizing: border-box;
        background: var(--input-gradient-grey);
        color: var(--text-white);
        outline: none;
      }
      .property-row input[type="color"] {
        width: 30px;
        height: 20px;
        padding: 0;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .property-row input:disabled,
      .property-row select:disabled {
        background: var(--input-gradient-grey-translucent);
        color: var(--panel-light-grey);
        cursor: not-allowed;
      }
      .property-row input::placeholder {
        color: var(--panel-light-grey);
        opacity: 0.7;
      }
      .property-row input:focus,
      .property-row select:focus {
        outline: none;
        border-color: var(--panel-selected);
      }
      .property-row input.modified,
      .property-row select.modified {
        border-color: var(--danger-red) !important;
        border-width: 1px;
      }
      .action-buttons {
        display: flex;
        flex-direction: row;
        gap: 8px;
        padding: 10px;
        border-top: 1px solid var(--panel-grey);
        background: transparent;
        justify-content: center;
      }
      .action-buttons button {
        padding: 5px 14px;
        font-size: 0.75rem;
        border: 1px solid var(--panel-grey);
        border-radius: 5px;
        cursor: pointer;
        min-width: 60px;
        font-weight: normal;
        background: var(--input-gradient-grey);
        color: var(--text-white);
        transition: all 0.2s ease;
      }
      .reset-button:hover:not(:disabled) {
        background: var(--panel-grey);
        border-color: var(--panel-light-grey);
      }
      .apply-button:hover:not(:disabled) {
        background: var(--panel-selected);
        border-color: var(--panel-selected);
      }
      .action-buttons button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* Kit Selector Styles */
      .kit-selector {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
      }
      .kit-selector-button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font-size: 0.75rem;
        background: var(--panel-dark-grey);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        color: var(--text-white);
        border: 1px solid var(--panel-grey);
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 140px;
        justify-content: space-between;
      }
      .kit-selector-button:hover {
        background: var(--panel-grey);
        border-color: var(--panel-light-grey);
      }
      .dropdown-arrow {
        font-size: 0.6rem;
        color: var(--panel-light-grey);
      }
      .kit-selector-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        min-width: 160px;
        background: var(--panel-dark-grey);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--panel-grey);
        border-radius: 5px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        padding: 6px 0;
      }
      .kit-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font-size: 0.75rem;
        color: var(--text-white);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .kit-option:hover {
        background: var(--panel-grey);
      }
      .kit-option input[type="checkbox"] {
        cursor: pointer;
        width: 14px;
        height: 14px;
      }
      .kit-option span {
        user-select: none;
      }
      /* Color Scheme Toggle Styles */
      .color-scheme-toggle {
        position: absolute;
        top: 10px;
        right: 160px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 27px;
        height: 27px;
        padding: 0;
        font-size: 1rem;
        background: var(--panel-dark-grey);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        color: var(--text-white);
        border: 1px solid var(--panel-grey);
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .color-scheme-toggle:hover {
        background: var(--panel-grey);
        border-color: var(--panel-light-grey);
        transform: scale(1.05);
      }
      .color-scheme-toggle:active {
        transform: scale(0.95);
      }
    </style>
  </body>
</html>
